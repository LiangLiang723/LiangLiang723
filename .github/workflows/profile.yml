name: 更新 Apple 风格 GitHub 主页

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"
  push:
    paths:
      - "README.md"
      - "assets/apple/**"
      - "assets/header.svg"
      - "assets/profile-badges.svg"
      - "assets/tech-stack.svg"
      - "assets/footer-line.svg"
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/apple/**"
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 验证主页结构与资源
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成 Apple 明暗主题资源
        run: python3 .github/scripts/generate_apple_assets.py

      - name: 移除旧版赛博资源
        run: rm -f assets/header.svg assets/profile-badges.svg assets/tech-stack.svg assets/footer-line.svg

      - name: 验证 Apple 主页
        run: python3 .github/scripts/validate_profile.py

  build-profile:
    name: 构建主页与统计卡片
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成 Apple 明暗主题资源
        run: python3 .github/scripts/generate_apple_assets.py

      - name: 移除旧版赛博资源
        run: rm -f assets/header.svg assets/profile-badges.svg assets/tech-stack.svg assets/footer-line.svg

      - name: 生成明亮主题统计卡片
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          UTC_OFFSET: 9
          EXCLUDE: ""
          THEME: github
          AUTO_PUSH: false

      - name: 生成深色主题统计卡片
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.ref_name }}
          UTC_OFFSET: 9
          EXCLUDE: ""
          THEME: github_dark
          AUTO_PUSH: false

      - name: 验证主页资源
        run: python3 .github/scripts/validate_profile.py

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets profile-summary-card-output/github profile-summary-card-output/github_dark
          git diff --cached --quiet || git commit -m "🎨 更新 Apple 明暗主题主页资源"
          git push origin HEAD:${GITHUB_REF_NAME}

  contribution-snake:
    name: 生成贡献轨迹
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 生成亮色和深色 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 更新 GitHub 贡献轨迹"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
