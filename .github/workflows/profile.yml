name: 更新 Linear GitHub 主页

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"
  push:
    paths:
      - "README.md"
      - "assets/linear/**"
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/linear/**"
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: linear-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 验证 Linear 主页结构
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: 生成 Linear 明暗主题资源
        run: python3 .github/scripts/generate_linear_assets.py

      - name: 验证 Linear 主页
        run: python3 .github/scripts/validate_profile.py

  build-profile:
    name: 更新主页数据与资源
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: 更新 GitHub 主页数据
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/fetch_profile_stats.py

      - name: 生成 Linear 明暗主题资源
        run: python3 .github/scripts/generate_linear_assets.py

      - name: 验证 Linear 主页
        run: python3 .github/scripts/validate_profile.py

      - name: 提交生成结果
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/linear
          git diff --cached --quiet || git commit -m "📊 更新 Linear 主页数据"
          git push origin HEAD:${GITHUB_REF_NAME}

  contribution-snake:
    name: 生成 Linear 紫蓝色贡献轨迹
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 生成明暗主题贡献轨迹
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%236E56CF&color_dots=%23ECECF0,%23D8D4F2,%23B9B1EA,%239185DE,%236E56CF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%238B7CF6&color_dots=%2316171A,%23292735,%233F3A5A,%23625A94,%238B7CF6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 更新 Linear 紫蓝色贡献轨迹"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
