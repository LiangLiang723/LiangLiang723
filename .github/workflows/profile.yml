name: 更新 Apple Editorial 2.0 GitHub 主页

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"
  push:
    paths:
      - "README.md"
      - "assets/apple/**"
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/apple/**"
      - ".github/scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 验证主页结构与资源
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: 生成 Editorial 2.0 明暗主题资源
        run: python3 .github/scripts/generate_apple_assets.py

      - name: 验证 Editorial 2.0 主页结构
        run: python3 .github/scripts/validate_profile.py

  build-profile:
    name: 构建主页与统计卡片
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: 生成 Editorial 2.0 明暗主题资源
        run: python3 .github/scripts/generate_apple_assets.py

      - name: 生成明亮主题统计卡片
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          UTC_OFFSET: 9
          EXCLUDE: ""
          THEME: github
          AUTO_PUSH: false

      - name: 生成深色主题统计卡片
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          UTC_OFFSET: 9
          EXCLUDE: ""
          THEME: github_dark
          AUTO_PUSH: false

      - name: 执行统计卡片样式处理
        id: style_summary
        continue-on-error: true
        run: python3 .github/scripts/style_summary_cards.py > summary-style.log 2>&1

      - name: 上传统计卡片诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-style-diagnostic
          path: |
            summary-style.log
            profile-summary-card-output/github/*.svg
            profile-summary-card-output/github_dark/*.svg
          retention-days: 1

      - name: 检查样式处理结果
        if: always()
        run: |
          cat summary-style.log
          test "${{ steps.style_summary.outcome }}" = "success"

      - name: 验证完整主页资源
        run: python3 .github/scripts/validate_profile.py --require-summary-cards

      - name: 提交生成结果
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets profile-summary-card-output/github profile-summary-card-output/github_dark
          git diff --cached --quiet || git commit -m "🎨 更新 Editorial 2.0 主页资源"
          git push origin HEAD:${GITHUB_REF_NAME}

  contribution-snake:
    name: 生成蓝灰色贡献轨迹
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 生成亮色和深色 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230071E3&color_dots=%23EBEDF0,%23D6E8FA,%239AC7F7,%235AA7F2,%230071E3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%230A84FF&color_dots=%231C1C1E,%232C3E50,%233D5F7A,%235A8DB8,%230A84FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到 output 分支
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 更新蓝灰色 GitHub 贡献轨迹"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
