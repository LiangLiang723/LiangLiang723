<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">亮亮 GitHub Profile Header</title>
  <desc id="desc">紫蓝赛博风格的嵌入式软件工程师主页横幅</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090B1A"/>
      <stop offset="42%" stop-color="#24104F"/>
      <stop offset="72%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#071A2E"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="35%" stop-color="#A78BFA"/>
      <stop offset="70%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowPurple">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#93C5FD" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#C4B5FD" fill-opacity="0.2"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="rounded">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <circle cx="132" cy="44" r="250" fill="url(#glowPurple)">
      <animate attributeName="r" values="220;270;220" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1085" cy="302" r="280" fill="url(#glowBlue)">
      <animate attributeName="r" values="250;300;250" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Circuit lines -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 90H145L190 135H330" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 12">
        <animate attributeName="stroke-dashoffset" values="0;-80" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M1200 72H1020L970 122H870" stroke="#22D3EE" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="7 11">
        <animate attributeName="stroke-dashoffset" values="0;72" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M0 292H245L285 252H395" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 14">
        <animate attributeName="stroke-dashoffset" values="0;-100" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M1200 274H1040L995 229H887" stroke="#E879F9" stroke-opacity="0.34" stroke-width="2" stroke-dasharray="6 12">
        <animate attributeName="stroke-dashoffset" values="0;90" dur="6.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Circuit nodes -->
    <g filter="url(#smallGlow)">
      <circle cx="145" cy="90" r="5" fill="#A78BFA"/>
      <circle cx="190" cy="135" r="5" fill="#C084FC"/>
      <circle cx="1020" cy="72" r="5" fill="#22D3EE"/>
      <circle cx="970" cy="122" r="5" fill="#67E8F9"/>
      <circle cx="245" cy="292" r="5" fill="#60A5FA"/>
      <circle cx="1040" cy="274" r="5" fill="#E879F9"/>
    </g>

    <!-- Decorative chips -->
    <g transform="translate(76 154)" opacity="0.82">
      <rect x="0" y="0" width="96" height="68" rx="10" fill="#0F172A" stroke="#A78BFA" stroke-width="2"/>
      <rect x="18" y="14" width="60" height="40" rx="6" fill="#1E1B4B" stroke="#C4B5FD" stroke-opacity="0.7"/>
      <g stroke="#A78BFA" stroke-width="3">
        <path d="M14 -9V0M34 -9V0M54 -9V0M74 -9V0"/>
        <path d="M14 68V77M34 68V77M54 68V77M74 68V77"/>
        <path d="M-9 14H0M-9 34H0M-9 54H0"/>
        <path d="M96 14H105M96 34H105M96 54H105"/>
      </g>
      <circle cx="48" cy="34" r="7" fill="#22D3EE" filter="url(#smallGlow)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(1034 142)" opacity="0.76">
      <rect x="0" y="0" width="88" height="88" rx="16" fill="#0F172A" stroke="#22D3EE" stroke-width="2"/>
      <path d="M21 44H67M44 21V67" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="44" r="17" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 5">
        <animateTransform attributeName="transform" type="rotate" from="0 44 44" to="360 44 44" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main text -->
    <g text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
      <text x="600" y="126" font-size="64" font-weight="800" letter-spacing="3" fill="url(#titleGradient)" filter="url(#softGlow)">
        LiangLiang723
      </text>

      <text x="600" y="183" font-size="26" font-weight="650" letter-spacing="2.5" fill="#E0E7FF">
        Embedded Software Engineer
      </text>

      <rect x="318" y="215" width="564" height="46" rx="23" fill="#0F172A" fill-opacity="0.7" stroke="#818CF8" stroke-opacity="0.55"/>
      <text x="600" y="246" font-size="18" font-weight="600" letter-spacing="1.3" fill="#BAE6FD">
        C / C++ · RTOS · STM32 · Zephyr · Flutter · Self-hosted
      </text>

      <text x="600" y="312" font-size="15" font-weight="500" letter-spacing="3.2" fill="#C4B5FD" opacity="0.9">
        BUILD CLEAR SYSTEMS · KEEP LEARNING · SHIP RELIABLE CODE
      </text>
    </g>

    <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="url(#titleGradient)" stroke-opacity="0.6" stroke-width="2"/>
  </g>
</svg>
