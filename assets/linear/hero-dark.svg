<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="238" viewBox="0 0 1200 238" role="img" aria-labelledby="title desc">
  <title id="title">亮亮的 Linear 风格主页横幅（dark）</title>
  <desc id="desc">显示 LiangLiang723、亮亮、嵌入式软件工程师和开发方向</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF0A" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.26"/>
      <stop offset="0.52" stop-color="#8B7CF6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6E7BF2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6E7BF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B7CF6"/>
      <stop offset="1" stop-color="#6E7BF2"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; }
    .display { font-weight: 720; letter-spacing: -2px; }
    .title { font-weight: 650; letter-spacing: -0.35px; }
    .body { font-weight: 430; }
    .label { font-weight: 560; letter-spacing: 0.15px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="1198" height="236" rx="18" fill="#121316" stroke="#FFFFFF1A" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="236" rx="18" fill="url(#grid)"/>
  <ellipse cx="1035" cy="94" rx="235" ry="180" fill="url(#glowA)"/>
  <ellipse cx="1105" cy="174" rx="160" ry="118" fill="url(#glowB)"/>
  <rect x="54" y="39" width="42" height="2" rx="1" fill="url(#accentLine)"/>
  <text x="54" y="69" font-size="15" fill="#96969D" class="label">LiangLiang723</text>
  <text x="51" y="129" font-size="52" fill="#F7F7F8" class="display">亮亮</text>
  <text x="54" y="163" font-size="21" fill="#F7F7F8" class="title">嵌入式软件工程师</text>
  <text x="54" y="199" font-size="17" fill="#96969D" class="body">专注设备控制、RTOS 与可靠软件架构。</text>
  <g opacity="0.68">
    <circle cx="1052" cy="112" r="4" fill="#8B7CF6"/>
    <line x1="1052" y1="112" x2="1122" y2="72" stroke="#FFFFFF1A"/>
    <line x1="1052" y1="112" x2="1114" y2="158" stroke="#FFFFFF1A"/>
    <circle cx="1122" cy="72" r="3" fill="#6E7BF2"/>
    <circle cx="1114" cy="158" r="3" fill="#6E7BF2"/>
  </g>

</svg>
