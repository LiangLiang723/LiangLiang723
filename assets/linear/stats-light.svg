<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title desc">
  <title id="title">亮亮的精简开发数据（light）</title>
  <desc id="desc">公开仓库 15，过去一年贡献 249，主要语言 HTML</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#171719" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6E56CF" stop-opacity="0.26"/>
      <stop offset="0.52" stop-color="#6E56CF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6E56CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5E6AD2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E56CF"/>
      <stop offset="1" stop-color="#5E6AD2"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Noto Sans CJK SC',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; }
    .display { font-weight: 720; letter-spacing: -2px; }
    .title { font-weight: 650; letter-spacing: -0.35px; }
    .body { font-weight: 430; }
    .label { font-weight: 560; letter-spacing: 0.15px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="1" y="1" width="1198" height="130" rx="16" fill="#F7F7F8" stroke="#171719" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="1" y="1" width="1198" height="130" rx="16" fill="url(#grid)" opacity="0.42"/>
  <rect x="52" y="32" width="3" height="66" rx="1.5" fill="url(#accentLine)"/>
  <text x="78" y="52" font-size="14" fill="#6B6B70" class="label">公开仓库</text>
  <text x="78" y="91" font-size="29" fill="#171719" class="title">15</text>

  <line x1="380" y1="32" x2="380" y2="100" stroke="#171719" stroke-opacity="0.08"/>
  <text x="430" y="52" font-size="14" fill="#6B6B70" class="label">过去一年贡献</text>
  <text x="430" y="91" font-size="29" fill="#171719" class="title">249</text>

  <line x1="750" y1="32" x2="750" y2="100" stroke="#171719" stroke-opacity="0.08"/>
  <text x="800" y="52" font-size="14" fill="#6B6B70" class="label">主要语言</text>
  <text x="800" y="91" font-size="29" fill="#171719" class="title">HTML</text>

  <circle cx="1137" cy="65" r="5" fill="#6E56CF"/>
  <circle cx="1137" cy="65" r="12" fill="none" stroke="#6E56CF" stroke-opacity="0.22"/>

</svg>
