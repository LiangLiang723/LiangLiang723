    <g font-size="16" font-weight="750" fill="#F8FAFC">
      <g transform="translate(32 58)"><rect width="170" height="54" rx="15" fill="#172033" stroke="#A8B9CC"/><circle cx="25" cy="27" r="8" fill="#A8B9CC"/><text x="43" y="33">C · 嵌入式开发</text></g>
      <g transform="translate(217 58)"><rect width="170" height="54" rx="15" fill="#13223A" stroke="#3B82F6"/><circle cx="25" cy="27" r="8" fill="#60A5FA"/><text x="43" y="33">C++ · 系统开发</text></g>
      <g transform="translate(402 58)"><rect width="170" height="54" rx="15" fill="#101D32" stroke="#2563EB"/><circle cx="25" cy="27" r="8" fill="#2563EB"/><text x="43" y="33">STM32 · MCU</text></g>
      <g transform="translate(587 58)"><rect width="190" height="54" rx="15" fill="#10251F" stroke="#22C55E"/><circle cx="25" cy="27" r="8" fill="#34D399"/><text x="43" y="33">FreeRTOS · 实时系统</text></g>
      <g transform="translate(792 58)"><rect width="216" height="54" rx="15" fill="#21143B" stroke="#8B5CF6"/><circle cx="25" cy="27" r="8" fill="#A78BFA"/><text x="43" y="33">Zephyr · 实时系统</text></g>

