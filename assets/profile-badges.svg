<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="76" viewBox="0 0 1040 76" role="img" aria-labelledby="title desc">
  <title id="title">亮亮的个人主页徽章</title>
  <desc id="desc">GitHub 账号、嵌入式软件工程师、MCU 与 RTOS 技术方向、持续构建状态</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1038" height="74" rx="19" fill="url(#panel)" stroke="url(#stroke)" stroke-width="2"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
    <g transform="translate(20 13)">
      <rect width="240" height="50" rx="15" fill="#161B22" stroke="#A855F7" stroke-opacity=".78"/>
      <circle cx="26" cy="25" r="9" fill="#A855F7" filter="url(#glow)"/>
      <text x="45" y="31">GitHub · LiangLiang723</text>
    </g>

    <g transform="translate(273 13)">
      <rect width="240" height="50" rx="15" fill="#111C34" stroke="#6366F1" stroke-opacity=".82"/>
      <circle cx="26" cy="25" r="9" fill="#818CF8" filter="url(#glow)"/>
      <text x="45" y="31">嵌入式软件工程师</text>
    </g>

    <g transform="translate(526 13)">
      <rect width="240" height="50" rx="15" fill="#0B2030" stroke="#0EA5E9" stroke-opacity=".82"/>
      <circle cx="26" cy="25" r="9" fill="#22D3EE" filter="url(#glow)"/>
      <text x="45" y="31">MCU · RTOS · 通信</text>
    </g>

    <g transform="translate(779 13)">
      <rect width="241" height="50" rx="15" fill="#10251F" stroke="#10B981" stroke-opacity=".82"/>
      <circle cx="26" cy="25" r="9" fill="#34D399" filter="url(#glow)"/>
      <text x="45" y="31">持续构建中</text>
    </g>
  </g>
</svg>
