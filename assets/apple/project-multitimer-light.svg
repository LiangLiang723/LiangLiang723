  <circle cx="1070" cy="207" r="44" fill="#E8F2FF"/>
  <path d="M1052 207h34m-14-14 14 14-14 14" fill="none" stroke="#0071E3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
