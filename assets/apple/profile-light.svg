<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">关于亮亮（light）</title>
  <desc id="desc">三张卡片介绍设备控制、实时系统架构、应用与自动化方向</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F5F7"/>
    </linearGradient>
    <linearGradient id="blueOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32ADE6"/>
      <stop offset="0.56" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#AF52DE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFFCC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#00000018"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#00000018"/>
    </filter>
  </defs>
  <style>
    text { font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; }
    .display { font-weight: 760; letter-spacing: -2.2px; }
    .title { font-weight: 720; letter-spacing: -0.6px; }
    .body { font-weight: 460; }
    .label { font-weight: 620; letter-spacing: 0.2px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="260" rx="30" fill="url(#canvas)"/>
<rect x="40" y="34" width="360" height="192" rx="28" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1" filter="url(#smallShadow)"/>
<circle cx="94" cy="88" r="24" fill="#0071E3" opacity="0.14"/>
<text x="94" y="95" font-size="15" fill="#0071E3" class="label" text-anchor="middle">01</text>
<text x="72" y="140" font-size="24" fill="#1D1D1F" class="title" text-anchor="start">设备与控制</text>
<text x="72" y="176" font-size="16" fill="#515154" class="body" text-anchor="start">嵌入式软件、设备通信与控制系统</text>
<line x1="72" y1="198" x2="152" y2="198" stroke="#0071E3" stroke-width="4" stroke-linecap="round"/>
<rect x="420" y="34" width="360" height="192" rx="28" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1" filter="url(#smallShadow)"/>
<circle cx="474" cy="88" r="24" fill="#34C759" opacity="0.14"/>
<text x="474" y="95" font-size="15" fill="#34C759" class="label" text-anchor="middle">02</text>
<text x="452" y="140" font-size="24" fill="#1D1D1F" class="title" text-anchor="start">架构与实时系统</text>
<text x="452" y="176" font-size="16" fill="#515154" class="body" text-anchor="start">RTOS、任务调度、状态管理与可维护架构</text>
<line x1="452" y1="198" x2="532" y2="198" stroke="#34C759" stroke-width="4" stroke-linecap="round"/>
<rect x="800" y="34" width="360" height="192" rx="28" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1" filter="url(#smallShadow)"/>
<circle cx="854" cy="88" r="24" fill="#AF52DE" opacity="0.14"/>
<text x="854" y="95" font-size="15" fill="#AF52DE" class="label" text-anchor="middle">03</text>
<text x="832" y="140" font-size="24" fill="#1D1D1F" class="title" text-anchor="start">应用与自动化</text>
<text x="832" y="176" font-size="16" fill="#515154" class="body" text-anchor="start">Flutter、Docker、自托管服务与 AI 辅助开发</text>
<line x1="832" y1="198" x2="912" y2="198" stroke="#AF52DE" stroke-width="4" stroke-linecap="round"/>
</svg>
