<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-labelledby="title desc">
  <title id="title">项目：SuperCom（light）</title>
  <desc id="desc">服务嵌入式联调的串口通信与设备调试工具</desc>
  <defs>
    <linearGradient id="heroSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F5F7"/>
    </linearGradient>
    <radialGradient id="blueOrb" cx="32%" cy="26%" r="74%">
      <stop offset="0" stop-color="#0071E3" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#0071E3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0071E3" stop-opacity="0.04"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00000018"/>
    </filter>
  </defs>
  <style>
    text { font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; }
    .display { font-weight: 760; letter-spacing: -2.2px; }
    .title { font-weight: 700; letter-spacing: -0.5px; }
    .body { font-weight: 460; }
    .label { font-weight: 620; letter-spacing: 0.1px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="8" y="8" width="1184" height="236" rx="24" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1" filter="url(#cardShadow)"/>
<circle cx="62" cy="61" r="22" fill="#0071E3" opacity="0.12"/>
<text x="62" y="69" font-size="22" fill="#0071E3" class="title" text-anchor="middle">⌁</text>
