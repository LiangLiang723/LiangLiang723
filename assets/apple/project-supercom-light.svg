<text x="54" y="132" font-size="24" fill="#6E6E73" class="body" text-anchor="start">服务嵌入式联调的串口通信与设备调试工具</text>
<rect x="54" y="178" width="156" height="42" rx="18" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="1"/>
