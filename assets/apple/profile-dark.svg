<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" role="img" aria-labelledby="title desc">
  <title id="title">关于亮亮（dark）</title>
  <desc id="desc">设备控制、实时系统架构、应用开发与自动化能力概览</desc>
  <defs>
    <linearGradient id="heroSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1C1E"/>
      <stop offset="1" stop-color="#2C2C2E"/>
    </linearGradient>
    <radialGradient id="blueOrb" cx="32%" cy="26%" r="74%">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#0A84FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.04"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00000000"/>
    </filter>
  </defs>
  <style>
    text { font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; }
    .display { font-weight: 760; letter-spacing: -2.2px; }
    .title { font-weight: 700; letter-spacing: -0.5px; }
    .body { font-weight: 460; }
    .label { font-weight: 620; letter-spacing: 0.1px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="8" y="8" width="1184" height="198" rx="24" fill="#1C1C1E" stroke="#38383A" stroke-width="1"/>
<circle cx="56" cy="62" r="6" fill="#0A84FF"/>
<text x="74" y="69" font-size="21" fill="#F5F5F7" class="title" text-anchor="start">设备与控制</text>
<text x="56" y="112" font-size="17" fill="#A1A1A6" class="body" text-anchor="start"><tspan x="56" dy="0">嵌入式软件、设备通信</tspan><tspan x="56" dy="28">与控制系统</tspan></text>
<circle cx="424" cy="62" r="6" fill="#0A84FF"/>
<text x="442" y="69" font-size="21" fill="#F5F5F7" class="title" text-anchor="start">架构与实时系统</text>
<text x="424" y="112" font-size="17" fill="#A1A1A6" class="body" text-anchor="start"><tspan x="424" dy="0">RTOS、任务调度、状态管理</tspan><tspan x="424" dy="28">与可维护架构</tspan></text>
<circle cx="792" cy="62" r="6" fill="#0A84FF"/>
<text x="810" y="69" font-size="21" fill="#F5F5F7" class="title" text-anchor="start">应用与自动化</text>
<text x="792" y="112" font-size="17" fill="#A1A1A6" class="body" text-anchor="start"><tspan x="792" dy="0">Flutter、Docker、自托管服务</tspan><tspan x="792" dy="28">与 AI 辅助开发</tspan></text>
</svg>
