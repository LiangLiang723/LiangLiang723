  <text x="222" y="122" font-size="47" fill="#F5F5F7" class="display" text-anchor="start">AI Berkshire</text>
  <text x="222" y="171" font-size="25" fill="#D1D1D6" class="body" text-anchor="start">面向 AI 时代的价值投资研究框架</text>
