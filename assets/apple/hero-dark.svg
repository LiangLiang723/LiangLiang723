<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">亮亮的 Apple Editorial 2.0 主页首屏（dark）</title>
  <desc id="desc">显示 LiangLiang723、嵌入式软件工程师身份、开发理念和核心技术方向</desc>
  <defs>
    <linearGradient id="heroSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1C1E"/>
      <stop offset="1" stop-color="#2C2C2E"/>
    </linearGradient>
    <radialGradient id="blueOrb" cx="32%" cy="26%" r="74%">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#0A84FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.04"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00000000"/>
    </filter>
  </defs>
  <style>
    text { font-family: system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif; }
    .display { font-weight: 760; letter-spacing: -2.2px; }
    .title { font-weight: 700; letter-spacing: -0.5px; }
    .body { font-weight: 460; }
    .label { font-weight: 620; letter-spacing: 0.1px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="8" y="8" width="1184" height="284" rx="24" fill="url(#heroSurface)" stroke="#38383A" stroke-width="1"/>
  <circle cx="1010" cy="148" r="78" fill="url(#blueOrb)"/>
  <circle cx="985" cy="122" r="24" fill="#0A84FF" opacity="0.08"/>
  <text x="60" y="54" font-size="17" fill="#0A84FF" class="label" text-anchor="start">你好，我是亮亮</text>
  <text x="56" y="116" font-size="58" fill="#F5F5F7" class="display" text-anchor="start">LiangLiang723</text>
  <text x="60" y="153" font-size="24" fill="#A1A1A6" class="title" text-anchor="start">嵌入式软件工程师</text>
  <text x="60" y="205" font-size="22" fill="#F5F5F7" class="title" text-anchor="start">让复杂系统保持清晰，</text>
  <text x="60" y="236" font-size="22" fill="#F5F5F7" class="title" text-anchor="start">让可靠软件持续演进。</text>
  <text x="60" y="271" font-size="16" fill="#A1A1A6" class="label" text-anchor="start">C / C++ · RTOS · STM32 · Flutter</text>

</svg>
