<circle cx="373" cy="78" r="22" fill="#34C759" opacity="0.14"/>
<text x="373" y="86" font-size="22" fill="#34C759" class="title" text-anchor="middle">◴</text>
<text x="353" y="124" font-size="13" fill="#86868B" class="label" text-anchor="start">Real-time</text>
<text x="353" y="158" font-size="22" fill="#1D1D1F" class="title" text-anchor="start">RTOS</text>
